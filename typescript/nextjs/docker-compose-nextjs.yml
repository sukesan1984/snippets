version: '3.8'

services:
  backend-nextjs:
    build:
      context: ./backend-nextjs
      dockerfile: Dockerfile
      target: deps
    container_name: backend-nextjs-dev
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
    volumes:
      - ./backend-nextjs:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    command: npm run dev
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: frontend-nextjs-backend-dev
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - API_URL=http://backend:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    command: npm run dev
    depends_on:
      - backend-nextjs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge