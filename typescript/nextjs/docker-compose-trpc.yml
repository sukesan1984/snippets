version: '3.8'

services:
  backend-trpc:
    build:
      context: ./backend-trpc
      dockerfile: Dockerfile
      target: deps
    container_name: backend-trpc-dev
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
    volumes:
      - ./backend-trpc:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: frontend-trpc-dev
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - API_URL=http://backend:3001
      - NEXT_PUBLIC_TRPC_URL=http://localhost:3003/trpc
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    command: npm run dev
    depends_on:
      - backend-trpc
    networks:
      - app-network

networks:
  app-network:
    driver: bridge